  <style>
    /* ===== Custom Cursor（16px 實心圓）===== */
    @media (hover: hover) and (pointer: fine) {
      html.has-cursor, html.has-cursor * { cursor: none !important; }
      .custom-cursor {
        position: fixed; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%;
        background: #111111; box-shadow: none;
        pointer-events: none; z-index: 100000; opacity: 0;
        transition: background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease, scale 0.18s ease-out;
        will-change: translate, scale;
      }
      .custom-cursor.visible { opacity: 1; }
      /* 商品圖：游標變成毛玻璃圓形 + VIEW（圓心不變，往四周長大） */
      .custom-cursor { display: flex; align-items: center; justify-content: center; margin: 0; }
      .custom-cursor span { font-family: var(--font-brand, 'Montserrat', sans-serif); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-indent: 0.14em; color: rgba(34,34,34,0.85); opacity: 0; transition: opacity 0.15s ease; user-select: none; }
      .custom-cursor.is-view { width: 72px; height: 72px; margin: -28px 0 0 -28px; background: rgba(170,170,170,0.42); -webkit-backdrop-filter: blur(7px) saturate(1.1); backdrop-filter: blur(7px) saturate(1.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); scale: 1; }
      .custom-cursor.is-view span { opacity: 1; transition-delay: 0.1s; }
      .custom-cursor { transition: width 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), height 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), margin 0.28s cubic-bezier(0.2, 0.7, 0.3, 1), background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease, scale 0.18s ease-out; }
      /* hover 到可點擊元素：16px → 14px（scale 0.875），平滑縮小，無彈跳 */
      .custom-cursor.is-small { scale: 0.875; }
      /* 只有「加入購物車」與「討論區」hover 時才變紅，沒有 glow */
      .custom-cursor.is-red { background: #c8161d; box-shadow: none; }
      /* 正式進入討論區後：永遠紅色 + 細微紅色光暈 */
      body.hacked .custom-cursor, body.hacked .custom-cursor.is-red {
        background: #c8161d; box-shadow: 0 0 10px 4px rgba(200, 22, 29, 0.65), 0 0 26px 10px rgba(200, 22, 29, 0.35);
      }
    }

    /* ===== Intro：進場動畫期間鎖定捲動，並先隱藏標準字避免閃一下 ===== */
    html.intro-playing, body.intro-playing { overflow: hidden; }
    html.intro-playing { scrollbar-gutter: stable; }            /* 鎖定時保留捲軸空間，標準字位置不會偏移 */
    html.intro-playing .brand-logo path { opacity: 0; }
  </style>

  <script>
    /* Custom Cursor：預設黑色；只有加入購物車 / 討論區 hover 變紅；進入討論區後永遠紅色 + glow（見 CSS 的 body.hacked） */
    (function () {
      if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;   // 手機/觸控不啟用
      const dot = document.createElement('div');
      dot.className = 'custom-cursor';
      dot.innerHTML = '<span>VIEW</span>';
      document.body.appendChild(dot);
      document.documentElement.classList.add('has-cursor');
      const RED_TARGETS = '.btn-add-cart, #discussionSection';
      const CLICKABLE = 'a, button, input, select, textarea, label, summary, [role="button"], [onclick], .nav-menu-btn, .category-item, .product-card, .thumb-item, .accordion-item, .play-btn, .discussion-section';
      const isClickable = (t) => {
        const c = t.closest && t.closest(CLICKABLE);
        if (c && c.matches('.discussion-section') && document.body.classList.contains('hacked')) return false;   // 進入討論區後它不再是可點擊區域
        return !!c;
      };
      document.addEventListener('mousemove', (e) => {
        dot.style.translate = (e.clientX - 8) + 'px ' + (e.clientY - 8) + 'px';   // 位置用 translate、縮放用 scale，兩者分開，縮放才不會把位置一起縮偏
        dot.classList.add('visible');
        dot.classList.toggle('is-red', !!(e.target.closest && e.target.closest(RED_TARGETS)));
        const inView = !!(e.target.closest && e.target.closest('.product-image-wrap'));
        dot.classList.toggle('is-view', inView);
        dot.classList.toggle('is-small', !inView && isClickable(e.target));
      }, { passive: true });
      document.documentElement.addEventListener('mouseleave', () => { dot.classList.remove('visible', 'is-red', 'is-small', 'is-view'); });
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    /* ==========================================================================
       OPAQUE 標準字進場動畫（每次載入都播放）
       只動畫 #brandLogo 裡面的 path；Logo 本身的位置/縮放仍由 script.js 控制
       ========================================================================== */
    (function () {
      const html = document.documentElement;
      const body = document.body;
      const logo = document.getElementById('brandLogo');
      if (!logo || !html.classList.contains('intro-playing')) return;   // 減少動態效果：直接略過

      /* ---------- 捲動鎖定：overflow + 攔截滾輪 / 觸控 / 鍵盤 ---------- */
      body.classList.add('intro-playing');
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.scrollTo(0, 0);                                            // 一定從第一屏開始
      const stop = (e) => e.preventDefault();
      const stopKeys = (e) => {
        if ([' ', 'PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
      };
      window.addEventListener('wheel', stop, { passive: false });
      window.addEventListener('touchmove', stop, { passive: false });
      window.addEventListener('keydown', stopKeys);

      const paths = Array.from(logo.querySelectorAll('path'));
      const SVGNS = 'http://www.w3.org/2000/svg';
      let done = false;

      const unlock = () => {
        if (done) return; done = true;
        paths.forEach((el) => { el.removeAttribute('filter'); if (typeof gsap !== 'undefined') gsap.set(el, { clearProps: 'all' }); });
        const defs = logo.querySelector('#introDefs'); if (defs) defs.remove();
        logo.style.removeProperty('overflow');
        html.classList.remove('intro-playing');                         // 先移除隱藏用的 class，再清掉 inline 樣式，同一幀內完成
        paths.forEach((el) => el.style.removeProperty('opacity'));
        body.classList.remove('intro-playing');
        window.removeEventListener('wheel', stop);
        window.removeEventListener('touchmove', stop);
        window.removeEventListener('keydown', stopKeys);
      };

      /* 保險：GSAP 載入失敗時不要卡住使用者 */
      if (typeof gsap === 'undefined') { unlock(); return; }
      setTimeout(unlock, 4500);                                         // 保險：最晚 4.5 秒一定解鎖

      /* ---------- 依 path 的水平位置分組（E 由兩塊組成，會歸在同一組）---------- */
      const items = paths.map((el) => { const b = el.getBBox(); return { el, x: b.x }; }).sort((a, b) => a.x - b.x);
      const groups = [];
      items.forEach((it) => {
        const g = groups[groups.length - 1];
        if (g && Math.abs(g.x - it.x) < 20) g.els.push(it.el); else groups.push({ x: it.x, els: [it.el] });
      });

      /* ---------- 為每組建立橫向模糊濾鏡（SVG filter，Safari 也支援）---------- */
      logo.style.overflow = 'visible';                                  // 模糊與位移不會被 SVG 邊界裁掉
      const defs = document.createElementNS(SVGNS, 'defs');
      defs.id = 'introDefs';
      logo.insertBefore(defs, logo.firstChild);
      groups.forEach((g, i) => {
        const f = document.createElementNS(SVGNS, 'filter');
        f.id = 'introBlur' + i;
        ['x:-60%', 'y:-80%', 'width:220%', 'height:260%'].forEach((kv) => { const [k, v] = kv.split(':'); f.setAttribute(k, v); });
        const blur = document.createElementNS(SVGNS, 'feGaussianBlur');
        blur.setAttribute('stdDeviation', '0 0');
        f.appendChild(blur); defs.appendChild(f);
        g.blur = blur;
        g.v = { bx: 22, by: 2.5 };                                      // 起始：橫向拖影式模糊
        g.els.forEach((el) => el.setAttribute('filter', 'url(#introBlur' + i + ')'));
        blur.setAttribute('stdDeviation', g.v.bx + ' ' + g.v.by);
      });

      /* ---------- Timeline ---------- */
      const tl = gsap.timeline({ defaults: { overwrite: 'auto' } });
      groups.forEach((g, i) => {
        const t = 0.05 + i * 0.15;                                      // 由左到右依序出現
        const dir = i % 2 ? 1 : -1;                                     // 相鄰字母左右小幅錯位
        gsap.set(g.els, { opacity: 0, x: -14 + dir * 6 });
        tl.to(g.els, { opacity: 1, duration: 0.55, ease: 'power1.out' }, t)
          .to(g.els, { x: 0, duration: 0.95, ease: 'power3.out' }, t)
          .to(g.v, {
            bx: 0, by: 0, duration: 0.95, ease: 'power2.out',
            onUpdate: () => g.blur.setAttribute('stdDeviation', g.v.bx.toFixed(2) + ' ' + g.v.by.toFixed(2))
          }, t);
      });
      tl.call(unlock);                                                  // 動畫一跑完就立刻解鎖，馬上可以往下滑
    })();
  </script>
